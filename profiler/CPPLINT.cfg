# cpplint (Google's style checker) settings for the profiler's C++ code.
# Run it via scripts/dev/check_cpp_style.sh.
set noparent
linelength=120
# the profiler includes its own headers relative to the include roots of its targets
# (e.g. "utils/x.hpp"), not relative to the repository root
filter=-build/include_subdir
# C++17/20 headers such as <filesystem> are fine: the profiler is built as C++20
filter=-build/c++17
# TODOs name no owner (like google-readability-todo, which .clang-tidy disables)
filter=-readability/todo
# cpplint reads clang-tidy's NOLINTBEGIN(<check>)/NOLINTEND(<check>) as its own markers
filter=-readability/nolint
exclude_files=third_party|build
